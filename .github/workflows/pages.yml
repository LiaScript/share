# Publishes the share page. ice.json and signaling.json come from the
# organization secrets of the LiaScript build: WEBRTC_ICE_SERVERS, the
# STUN/TURN servers as a JSON list of RTCIceServer objects
# ([{"urls":"turn:…","username":"…","credential":"…"}]), and
# WEBRTC_SIGNALING_SERVERS, the y-webrtc signalling servers as a JSON list of
# URLs (["wss://…"]). Without them the lists are [] and the page falls back
# to a public signalling server and STUN only (lia-rtc.mjs).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Page, ice.json and signaling.json
        env:
          WEBRTC_ICE_SERVERS: ${{ secrets.WEBRTC_ICE_SERVERS }}
          WEBRTC_SIGNALING_SERVERS: ${{ secrets.WEBRTC_SIGNALING_SERVERS }}
        run: |
          mkdir _site
          cp index.html lia-share.js lia-share-sw.js lia-share-relay.html lia-share-relay.js lia-rtc.mjs _site/
          node -e '
            for (const [name, file] of [["WEBRTC_ICE_SERVERS", "ice.json"], ["WEBRTC_SIGNALING_SERVERS", "signaling.json"]]) {
              let list = []
              try { list = JSON.parse(process.env[name] || "[]") } catch (e) { console.log(name + " is no JSON, publishing none") }
              if (!Array.isArray(list)) list = []
              require("fs").writeFileSync("_site/" + file, JSON.stringify(list))
              console.log(list.length + " in " + file)
            }
          '
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
